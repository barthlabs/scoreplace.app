name: iOS nativo — validação e TestFlight

# O binário nativo tem um ciclo deliberadamente separado do web. O Firebase
# Hosting é a publicação de produção do Scoreplace; commits do produto web NÃO
# podem acionar Xcode, TestFlight ou alertas de CI. Execute este workflow apenas
# manualmente ao fechar um lote nativo para App Store/TestFlight.
#
# REGRA ANTI-REGRESSÃO: não reintroduzir gatilhos push/pull_request aqui. Mesmo
# mudanças em ios/** aguardam a decisão explícita de preparar uma nova versão
# nativa, para não inflar builds e não gerar alertas operacionais inúteis.
on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Enviar esta build validada ao TestFlight'
        required: true
        default: false
        type: boolean

      archive_recipient:
        description: 'Certificado público X.509 (PEM em base64) para recuperar o archive e as capturas'
        required: false
        type: string

env:
  ARCHIVE_RECIPIENT: ${{ inputs.archive_recipient }}

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Abrir o candidato nos simuladores iPhone e Apple Watch
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Xcode 27 exclui watchOS 8 e o Apple Watch Series 3. A imagem macOS 26
      # inclui 26.6 em paralelo; o caminho explícito impede regressão silenciosa.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validar destinatário dos artefatos
        if: inputs.archive_recipient != ''
        run: scripts/ios-ci-artifact.sh validate

      - name: Conferir Xcode fixado e versão nativa
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'watchos(8|9|10|11|26)'
          node scripts/check-versao-nativa.js ios
          node scripts/check-native-release-candidate.js
          node scripts/check-release-notes.js

      - name: Instalar dependências e montar assets Capacitor
        run: |
          npm ci --ignore-scripts
          npm run cap:sync
          scripts/check-embedded-www.sh ios

      - name: Instalar e abrir o candidato no iPhone e no Watch pareados
        run: scripts/ios-simulator-smoke.sh "$RUNNER_TEMP/scoreplace-simuladores"

      - name: Cifrar evidências da inicialização
        if: inputs.archive_recipient != ''
        run: scripts/ios-ci-artifact.sh encrypt "$RUNNER_TEMP/scoreplace-simuladores"

      - uses: actions/upload-artifact@v4
        if: inputs.archive_recipient != ''
        with:
          name: scoreplace-simuladores-${{ github.run_number }}
          path: ${{ runner.temp }}/scoreplace-upload/package.cms
          if-no-files-found: error
          retention-days: 1

  testflight:
    name: Archive assinado e TestFlight
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
      IOS_WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WATCH_PROVISIONING_PROFILE_BASE64 }}
      # /tmp é efêmero no runner hospedado. O contexto `runner` não é válido
      # neste bloco de ambiente de job (só dentro de etapas).
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validar destinatário do archive
        if: inputs.archive_recipient != ''
        run: scripts/ios-ci-artifact.sh validate

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Criar archive assinado e validar companion do Watch
        shell: bash
        run: |
          source scripts/ios-ci-signing.sh
          if [ '${{ inputs.upload_testflight }}' = 'true' ]; then
            scripts/ios-archive.sh --export
          else
            scripts/ios-archive.sh
          fi

      - name: Cifrar o archive assinado
        if: inputs.archive_recipient != ''
        run: |
          shopt -s nullglob
          archives=("$TMPDIR"/scoreplace-*.xcarchive)
          [[ ${#archives[@]} -eq 1 ]]
          scripts/ios-ci-artifact.sh encrypt "${archives[0]}"

      - uses: actions/upload-artifact@v4
        if: inputs.archive_recipient != ''
        with:
          name: scoreplace-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/scoreplace-upload/package.cms
          if-no-files-found: error
          retention-days: 1
