<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    v0.17.73: full-bleed (sem rx) — ver comentário equivalente em icon-192.svg.
    Conteúdo dentro da safe zone interna 80%, sistema aplica seu próprio mask.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ⭐ 12/set/2026 — O PÓDIO ENCHE O ÍCONE (ordem do dono, print do atalho no Chrome ao
       lado de instagram/youtube): _"nosso ícone é pequeno em relação aos demais. a parte azul
       não conta, é preenchimento; o que conta é o pódio com as barras e a estrela. devem
       encher o espaço sem cortar nos cantos"_.
       O desenho é o MESMO, ampliado 1,25x a partir do centro — o mesmo enquadramento que o
       icon-maskable.svg já usava desde a 1.9.86.
       ⛔ O TETO É MEDIDO E É O CÍRCULO, NÃO O QUADRADO: os cantos INFERIORES do pódio (prata e
       bronze) são os pontos mais distantes do centro — raio 204,6 de 256. ⛔ Em 1,26 eles ENCOSTAM na borda do recorte circular que o atalho aplica; 1,25 leva o raio a 248,6 e
       deixa ~7px de folga. Não subir sem refazer essa conta.
       ⚠️ O ícone das LOJAS (AppIcon) NÃO sai daqui — lá a margem larga é exigida por elas. -->
  <!--
    2.3.1 — O PÓDIO SOBE PARA PODER CRESCER.
    Relato do dono (13/set/2026, print do atalho ao lado de instagram e youtube):
    _"o nosso icone continua ridiculamente pequeno aqui"_ — e ele estava certo, mesmo
    depois do conserto anterior. MEDIDO no PNG que o navegador serve: o pódio ocupava
    68% da largura. O `scale(1.25)` de então já era o TETO, porque os pontos extremos
    são os cantos de BAIXO das barras laterais, na diagonal — a 204,6 de um raio de 256.
    ⭐ A saída foi do dono: _"subindo um pouco o conjunto para que corte nada"_. Subir
    aproxima esses cantos do centro e libera escala. MEDIDO: subindo 42px cabe
    `scale(1.432)`; o pódio passa a ocupar 78% e o ponto mais distante fica em 255,6 de
    256 — ZERO pixel fora do círculo, conferido no pixel do PNG, não na conta do SVG.
    ⚠️ O portão antigo media o SVG e só o CABEÇALHO do PNG; por isso deu verde com a
    tela errada. Agora mede o desenho dentro do PNG. [[feedback_unify_dual_entry_points]]
  -->
    <!--
    2.3.76 — O PÓDIO DESCE 12px (ordem do dono, 18/set/2026, print do ícone: "a estrela está
    quase encostando no topo e embaixo tem um pouquinho de espaço"). Ele tinha razão e a conta
    explica: com translate 214 / scale 1,432 a PONTA DA ESTRELA ficava em y=0,6 de 512 e os
    cantos das barras a 255,9 do raio 256 — pinado nas duas pontas do círculo, zero folga.
    Descer sem sair do círculo exige encolher: translate 230 / scale 1,375 (16px abaixo do original; o dono pediu
    mais que os 12 primeiros) leva a estrela a y≈25 e os cantos a ≈255,4. Largura cai de 78% para ~74,7% — acima do piso de 74% do
    gerador, que segue medindo o PNG e recusando pixel fora do círculo.
  -->
  <g transform="translate(256,230.00) scale(1.375) translate(-256,-256)">
    <!-- Pódio: prata (2º), ouro (1º), bronze (3º) -->
    <rect x="117" y="267" width="85" height="139" rx="13" fill="#CBD5E1"/>
    <rect x="213" y="181" width="86" height="225" rx="13" fill="#F59E0B"/>
    <rect x="310" y="315" width="85" height="91" rx="13" fill="#FB923C"/>
    <!-- Estrela sobre o 1º lugar -->
    <path d="M 256 107 L 267 139 L 299 139 L 272 159 L 283 192 L 256 171 L 229 192 L 240 159 L 213 139 L 245 139 Z" fill="#F59E0B"/>
  </g>
</svg>
