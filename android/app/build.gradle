apply plugin: 'com.android.application'
// Kotlin só pelo Health Connect (WorkoutRecorder.kt) — o resto do :app segue Java.
apply plugin: 'kotlin-android'

android {
    namespace = "app.scoreplace"
    ndkVersion "25.2.9519653"
    testBuildType project.findProperty("scoreplaceTestBuildType") ?: "debug"
    compileSdk = rootProject.ext.compileSdkVersion

    // Assinatura de release via android/keystore.properties (gitignored). Se o
    // arquivo não existir, o release fica sem assinar (não quebra o config).
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) keystoreProps.load(new FileInputStream(keystorePropsFile))

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    // O Health Connect exige minSdk 26 e nosso piso é 24. Em vez de derrubar
    // Android 7, desugarizamos a core library (java.time) e forçamos o override no
    // manifest — em API < 26 o WorkoutRecorder simplesmente nunca roda
    // (HealthConnectClient.getSdkStatus != SDK_AVAILABLE).
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "app.scoreplace"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 189
        versionName "2.7.98"
        testInstrumentationRunner project.findProperty("scoreplaceTestRunner") ?: "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/datastore/CMakeLists.txt")
            version "3.22.1"
        }
    }
    // A cópia local tem DWARF. O gate de release confere qual ELF venceu o merge.
    packaging.jniLibs.pickFirsts += ["**/libdatastore_shared_counter.so"]

    buildTypes {
        release {
            // v1.7.76: R8 LIGADO por ordem do dono (pedida 3×). O que ele resolve é o
            // aviso "arquivo de desofuscação" do Play: com minify ligado nasce um
            // mapping.txt, e o `android.buildTypes.release` do AGP já o embute no .aab
            // (BUNDLE-METADATA), então o console para de pedir.
            // ⚠️ O RISCO É REAL E NÃO É TEÓRICO: os plugins do Capacitor são achados por
            // REFLEXÃO, pelo NOME da classe. Sem as regras de keep do proguard-rules.pro
            // o app COMPILA e sobe, e só morre em runtime (login, push, share). Por isso
            // o gate do emulador é OBRIGATÓRIO nesta build, não opcional.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release

            ndk { debugSymbolLevel "FULL" }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation("androidx.datastore:datastore-core-android") {
        version { strictly "1.1.7" }
        because "O JNI compilado neste módulo corresponde a essa versão do AndroidX."
    }
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Ponte pro smartwatch (fase 4): Wear Data Layer (MessageClient/NodeClient).
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
    // Grava o treino medido no relógio (ExerciseSessionRecord + HeartRateRecord).
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
