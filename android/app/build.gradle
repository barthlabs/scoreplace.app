apply plugin: 'com.android.application'
// Kotlin só pelo Health Connect (WorkoutRecorder.kt) — o resto do :app segue Java.
apply plugin: 'kotlin-android'

android {
    namespace = "app.scoreplace"
    compileSdk = rootProject.ext.compileSdkVersion

    // Assinatura de release via android/keystore.properties (gitignored). Se o
    // arquivo não existir, o release fica sem assinar (não quebra o config).
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) keystoreProps.load(new FileInputStream(keystorePropsFile))

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    // O Health Connect exige minSdk 26 e nosso piso é 24. Em vez de derrubar
    // Android 7, desugarizamos a core library (java.time) e forçamos o override no
    // manifest — em API < 26 o WorkoutRecorder simplesmente nunca roda
    // (HealthConnectClient.getSdkStatus != SDK_AVAILABLE).
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "app.scoreplace"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 36
        versionName "1.7.49"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release

            // ⚠️ NÃO adicionar `ndk { debugSymbolLevel ... }` aqui — TENTADO E MEDIDO (06/ago/2026).
            //
            // O Play avisa em todo upload: "contém código nativo e você não fez upload dos
            // símbolos de depuração". Parece um flag esquecido; não é.
            //
            // O único código nativo do pacote são 4 cópias (uma por ABI) de
            // `libdatastore_shared_counter.so`, 7 KB cada, que vêm do Firebase/DataStore —
            // NADA nosso. Extraí o .so do .aab e li as seções: existe só `.dynsym`, sem
            // `.symtab` e sem `.debug_*`. Ou seja, o Firebase publica a lib JÁ STRIPPADA.
            // Com `debugSymbolLevel 'SYMBOL_TABLE'` a task roda, não acha símbolo nenhum e o
            // .aab sai com o MESMO tamanho byte a byte e ZERO entradas em BUNDLE-METADATA.
            //
            // Conclusão: o aviso não tem conserto do nosso lado, e a config que "deveria"
            // resolvê-lo é config morta. O mesmo vale pro aviso irmão, de desofuscação: com
            // `minifyEnabled false` não existe mapping porque não existe ofuscação — as
            // stack traces já chegam legíveis, que é justamente o que aquele aviso pede.
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Ponte pro smartwatch (fase 4): Wear Data Layer (MessageClient/NodeClient).
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
    // Grava o treino medido no relógio (ExerciseSessionRecord + HeartRateRecord).
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
